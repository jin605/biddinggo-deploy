services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    image: local-jenkins-docker
    container_name: jenkins
    user: root
    restart: unless-stopped

    ports:
      - "8081:8080"
      - "50000:50000"

    environment:
      TZ: Asia/Seoul
      JENKINS_OPTS: "--prefix=/"

    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_home:
