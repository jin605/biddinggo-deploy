apiVersion: v1
kind: Service
metadata:
  name: jenkins-external
  namespace: argocd
spec:
  ports:
    - name: http
      port: 8081
      targetPort: 8081

---
apiVersion: v1
kind: Endpoints
metadata:
  name: jenkins-external
  namespace: argocd
subsets:
  - addresses:
      - ip: 192.168.45.115
    ports:
      - name: http
        port: 8081

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jenkins-ingress
  namespace: argocd
spec:
  ingressClassName: nginx
  rules:
    - host: jenkins.jinddd3.synology.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jenkins-external
                port:
                  number: 8081
