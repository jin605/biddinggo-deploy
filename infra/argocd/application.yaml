apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: biddinggo-app
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/jin605/biddinggo-deploy.git
    targetRevision: main
    path: infra/k8s
    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: biddinggo

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
